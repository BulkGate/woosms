services:
  wordpress:
    image: wordpress:6.7
    depends_on:
      - db
    ports:
      - "8082:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: test
      WORDPRESS_DB_PASSWORD: test
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WP_HOME: http://localhost:8082
      WP_SITEURL: http://localhost:8082
    volumes:
      - ./:/var/www/html/wp-content/plugins/woosms-sms-module-for-woocommerce

  db:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: test
      MYSQL_PASSWORD: test
      MYSQL_RANDOM_ROOT_PASSWORD: '1'
    volumes:
      - db:/var/lib/mysql

  adminer:
    image: adminer
    environment:
      ADMINER_DESIGN: "nette"
      ADMINER_DEFAULT_SERVER: "db"
    ports:
      - "8080:8080"

volumes:
  db: